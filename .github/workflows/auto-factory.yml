# AutoFactory Phase 1 — runs on every PR against this demo repo.
#
# One project holds both the app's flags and the factory's own AI configs, so a
# single SDK key serves both: the app evaluates flags with it, and the factory
# reads its agent configs with it. `bash demo/setup.sh` writes all four of these
# for you from .env.local, using your `gh auth login` session.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions → Secrets):
#   LD_SDK_KEY        — server SDK key (sdk-...) for the project below
#                       Find it: https://app.launchdarkly.com/settings/sdk-keys
#   LD_API_KEY        — API token with write access to that project (api-...)
#                       Find it: https://app.launchdarkly.com/settings/authorization
#   ANTHROPIC_API_KEY — Anthropic API key (sk-ant-...)
#                       Find it: https://console.anthropic.com/settings/keys
#
# Required GitHub variables (Settings → Secrets and variables → Actions → Variables):
#   LD_APP_PROJECT_KEY — the project key (e.g. checkout-demo)
#                        Must match the key used in `terraform apply`

name: LaunchDarkly AutoFactory

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  auto-factory:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'github-actions[bot]' &&
      (vars.AUTOFACTORY_REQUIRE_LABEL != 'true' ||
       contains(github.event.pull_request.labels.*.name, 'autofactory'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install ld-find-code-refs (knowledge-graph wrap points)
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/launchdarkly/ld-find-code-refs/releases/download/v2.14.0/ld-find-code-refs_2.14.0_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin ld-find-code-refs

      - name: LaunchDarkly AutoFactory Phase 1
        # Change the owner here if you host launchdarkly-auto-factory elsewhere.
        uses: launchdarkly-labs/launchdarkly-auto-factory/packages/phase1-resource-factory@main
        with:
          ld_sdk_key: ${{ secrets.LD_SDK_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          ld_app_project_key: ${{ vars.LD_APP_PROJECT_KEY }}
          ld_api_key: ${{ secrets.LD_API_KEY }}
          enable_flag_creation: "true"
          enable_code_changes: "true"
          pr_branch: ${{ github.event.pull_request.head.ref }}
          pr_base: ${{ github.event.pull_request.base.ref }}
          graph_key: gha-auto-factory
          github_token: ${{ secrets.GITHUB_TOKEN }}
