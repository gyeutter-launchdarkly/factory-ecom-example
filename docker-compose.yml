services:

  # ── Demo app ──────────────────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # The factory progress stream is written on the host by
      # demo/lib/progress-tap.mjs; the in-app flowchart tails it read-only.
      - ./.autofactory:/app/.autofactory:ro
    env_file:
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - LD_SDK_KEY=${LD_SDK_KEY:-}
      - DEPLOY_SHA=${DEPLOY_SHA:-dev}

  # ── Terraform ─────────────────────────────────────────────────────────────
  # Usage: docker compose run --rm terraform <command>
  # The Makefile wraps this so TF_VAR_* are passed automatically.
  terraform:
    # Profile keeps this out of `docker compose up` (i.e. `make dev`).
    # `docker compose run` auto-enables the profile, so the Makefile still works.
    profiles: ["tools"]
    image: hashicorp/terraform:1.9
    working_dir: /workspace/terraform
    volumes:
      - .:/workspace

  # ── Local CI (act) ────────────────────────────────────────────────────────
  # Runs the GitHub Actions workflow locally — same agents, no queue wait.
  # Needs the Docker socket so act can spawn runner containers.
  # Usage: make ci SCENARIO=dynamic-pricing
  ci:
    # Profile keeps this out of `docker compose up` — otherwise `make dev`
    # would start act and run the whole factory workflow unprompted.
    profiles: ["tools"]
    build:
      context: .
      dockerfile: demo/ci/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    working_dir: /workspace
    env_file:
      - path: .env.local
        required: false
